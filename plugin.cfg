# plugin.cfg – Ochsner OTS (ochsner2mqtt) für LoxBerry 4
# NAME/EMAIL unter [AUTHOR] sowie NAME/FOLDER unter [PLUGIN] nach der ersten
# Veröffentlichung nie mehr ändern: LoxBerry bildet daraus die Plugin-ID und
# erkennt Updates daran. Übernimmt später jemand anderes die Pflege, trägt er
# sich unter [MAINTAINER] ein (ab LoxBerry 4.0.1) und [AUTHOR] bleibt.

[AUTHOR]
NAME=cr0ssn0tice
EMAIL=cr0ssn0tice@proton.me

[PLUGIN]
VERSION=0.4.0
NAME=ochsner2mqtt
FOLDER=ochsner2mqtt
TITLE=Ochsner OTS
WEBSITE=https://github.com/cr0ssn0tice/LoxBerry-Plugin-ochsner2mqtt

[AUTOUPDATE]
# LoxBerry prüft release.cfg/prerelease.cfg im Repository auf neue Versionen.
# Neue Installationen übernehmen Releases automatisch; einstellbar in der Plugin-Verwaltung.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/cr0ssn0tice/LoxBerry-Plugin-ochsner2mqtt/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/cr0ssn0tice/LoxBerry-Plugin-ochsner2mqtt/main/prerelease.cfg

[SYSTEM]
REBOOT=false
# 4.0.1: Python-SDK (loxberry.log, loxberry.io) und [MAINTAINER]-Block
LB_MINIMUM=4.0.1
LB_MAXIMUM=false
ARCHITECTURE=false
# Protokollstufe über die LoxBerry-Pluginverwaltung bzw. die Plugin-Seite "Log"
CUSTOM_LOGLEVELS=true
INTERFACE=2.0
