<!-- ===================================================== STÖRUNGEN -->
<section data-section="overview" hidden>
  <div class="lb-card o2m-card">
    <div class="o2m-head"><div><h2><TMPL_VAR OV.TITLE></h2><p><TMPL_VAR OV.INTRO></p></div>

    <div class="o2m-tiles" id="ov-tiles"></div>

    </div>
  </div>
  <div id="ov-notify"></div>
  <div class="lb-card o2m-card">
    <div class="o2m-head"><div><h2><TMPL_VAR OV.HISTORY_TITLE></h2><p><TMPL_VAR OV.HISTORY_INTRO></p></div>

  </div>
</section>

<!-- ===================================================== LOXONE -->

        <code id="lx-res">ochsner/cmd_result</code>.</p></div></div>

<!-- ===================================================== KONFIGURATION -->
