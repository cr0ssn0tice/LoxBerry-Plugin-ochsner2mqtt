# Help panel (templates/help/help.html) – English
[HELP]
TITLE=Ochsner OTS – Help
APP=<b>Heat pump</b> is the app: plant diagram, control, time program, heating curve and energy. To operate the heat pump, Allow writing must be switched on under <b>Settings</b>.
LOXONE=<b>Loxone</b> lists all MQTT topics with the name of the virtual input and the command lines for virtual outputs (<code>publish ochsner/cmd/hc1/preset eco</code> to <code>/dev/udp/&lt;loxberry&gt;/11884</code>).
GATEWAY=With <b>MQTT Gateway V2</b> only subscribed topics reach the Miniserver: select them on the Loxone tab, then Subscribe in MQTT Gateway. With the classic gateway the plugin brings its own subscription. On uninstall the plugin removes its entries again.
T_VALUES=<b>Values:</b> <code>ochsner/plant/&lt;area&gt;/&lt;value&gt;</code>, plain texts under <code>…_text</code>
T_ALARMS=<b>Faults:</b> <code>ochsner/alarm/count</code>, <code>ochsner/alarm/active</code>
T_COMMANDS=<b>Commands:</b> <code>ochsner/cmd/…</code>, result under <code>ochsner/cmd_result</code>
T_STATUS=<b>Status:</b> <code>ochsner/status</code> (online/offline), <code>ochsner/connected</code>
FLASH=Every write ends up in the controller's flash memory: never write cyclically from Loxone. The daily limit and the counter are shown in the status bar of the app.
NOTIFY=Heat pump faults and longer connection losses appear in the LoxBerry notifications (can be switched off under Settings → Notifications). The LoxBerry healthcheck checks service, connection and faults.
BUFFER=If the buffer tank is missing from the diagram or shown by mistake: <b>Settings → Plant diagram</b>.
LOG=For troubleshooting: <b>Log</b> → log level Info or Debug, plus the diagnostic export without access data.
