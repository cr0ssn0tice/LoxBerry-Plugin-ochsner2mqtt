[LX]
TITLE=Path to the Miniserver
INTRO=The plugin sends all values via MQTT to the LoxBerry broker. LoxBerry's <b>MQTT Gateway</b> passes them on to the Miniserver, where you create <b>virtual inputs</b> with the names shown below. The Miniserver sends commands back via a <b>virtual output</b>. There is no direct connection between heat pump and Miniserver.
