# Hilfe-Panel (templates/help/help.html) – Deutsch
[HELP]
TITLE=Ochsner OTS – Hilfe
APP=<b>Wärmepumpe</b> ist die App: Anlagenschema, Bedienung, Zeitprogramm, Heizkurve und Energie. Zum Bedienen muss unter <b>Konfiguration</b> Schreiben erlauben eingeschaltet sein.
LOXONE=<b>Loxone</b> zeigt alle MQTT-Topics mit dem Namen des virtuellen Eingangs sowie die Befehlszeilen für virtuelle Ausgänge (<code>publish ochsner/cmd/hc1/preset eco</code> an <code>/dev/udp/&lt;loxberry&gt;/11884</code>).
GATEWAY=Mit dem <b>MQTT Gateway V2</b> gehen nur eingetragene Topics an den Miniserver: Auswahl im Reiter Loxone, dann Im MQTT Gateway eintragen. Beim klassischen Gateway bringt das Plugin sein Abo selbst mit. Beim Deinstallieren entfernt das Plugin seine Einträge wieder.
T_VALUES=<b>Werte:</b> <code>ochsner/plant/&lt;bereich&gt;/&lt;wert&gt;</code>, Klartexte unter <code>…_text</code>
T_ALARMS=<b>Störungen:</b> <code>ochsner/alarm/count</code>, <code>ochsner/alarm/active</code>
T_COMMANDS=<b>Befehle:</b> <code>ochsner/cmd/…</code>, Ergebnis unter <code>ochsner/cmd_result</code>
T_STATUS=<b>Status:</b> <code>ochsner/status</code> (online/offline), <code>ochsner/connected</code>
FLASH=Jeder Schreibzugriff landet im Regler-Flash: nie zyklisch aus Loxone schreiben. Das Tageslimit und der Zähler stehen in der Statusleiste der App.
NOTIFY=Störungen der Wärmepumpe und längere Verbindungsabbrüche erscheinen in den LoxBerry-Benachrichtigungen (abschaltbar unter Konfiguration → Benachrichtigungen). Der LoxBerry-Healthcheck prüft Dienst, Verbindung und Störungen.
BUFFER=Fehlt der Pufferspeicher im Schema oder wird er fälschlich gezeigt: <b>Konfiguration → Anlagenschema</b>.
LOG=Für die Fehlersuche: <b>Log</b> → Protokollstufe Info oder Debug, dazu der Diagnose-Export ohne Zugangsdaten.
