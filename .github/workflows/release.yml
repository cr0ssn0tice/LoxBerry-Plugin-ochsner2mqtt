name: Release

# Baut das Installations-ZIP und hängt es mit den Notizen aus CHANGELOG.md an das GitHub-Release.
# Auslöser: ein Tag vX.Y.Z (gleich VERSION in plugin.cfg) – per git push oder über
# "Releases → Draft a new release" in der GitHub-Oberfläche. Läuft mehrfach ohne Schaden.
# Danach release.cfg auf main anpassen (VERSION, ARCHIVEURL) – erst dann melden die LoxBerrys das Update.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version prüfen
        run: |
          V="$(sed -n 's/^VERSION=//p' plugin.cfg | head -n 1)"
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} passt nicht zu plugin.cfg ($V)"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Installations-ZIP bauen
        run: tools/build-release.sh
      - name: Release-Notizen aus CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          printf '\n---\nInstallation: **LoxBerry-Plugin-ochsner2mqtt-%s.zip** herunterladen und in der LoxBerry-Plugin-Verwaltung installieren. Anleitung: [docs/installation.md](https://github.com/%s/blob/main/docs/installation.md)\n' "$VERSION" "$GITHUB_REPOSITORY" >> notes.md
      - name: Release anlegen oder ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease";; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Ochsner OTS $VERSION" --notes-file notes.md $PRE
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Ochsner OTS $VERSION" --notes-file notes.md $PRE
          fi
