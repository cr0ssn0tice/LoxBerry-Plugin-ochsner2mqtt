name: Release

# Ein Tag vX.Y.Z (gleich VERSION in plugin.cfg) baut das Installations-ZIP und legt das GitHub-Release an.
# Danach release.cfg auf main anpassen (VERSION, ARCHIVEURL) – erst dann melden LoxBerrys das Update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version prüfen
        run: |
          V="$(sed -n 's/^VERSION=//p' plugin.cfg | head -n 1)"
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} passt nicht zu plugin.cfg ($V)"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Installations-ZIP bauen
        run: tools/build-release.sh
      - name: Release-Notizen aus CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          printf '\n---\nInstallation: ZIP herunterladen und in der LoxBerry-Plugin-Verwaltung installieren. Anleitung: [docs/installation.md](https://github.com/%s/blob/main/docs/installation.md)\n' "$GITHUB_REPOSITORY" >> notes.md
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Ochsner OTS $VERSION" --notes-file notes.md $PRE
