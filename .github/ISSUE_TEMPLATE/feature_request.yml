name: Idee oder Wunsch
description: Neue Funktion, weitere Werte, andere Anlage
labels: [enhancement]
body:
  - type: textarea
    id: wunsch
    attributes:
      label: Was soll das Plugin können?
    validations:
      required: true
  - type: textarea
    id: zweck
    attributes:
      label: Wofür brauchst du es (z. B. in Loxone)?
  - type: input
    id: anlage
    attributes:
      label: Wärmepumpe und Reglersoftware
